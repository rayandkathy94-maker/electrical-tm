<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Electrical Daily T&M Report - V2</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin:0; background:#eef1f5; color:#111; }
  .wrap { max-width:820px; margin:auto; padding:14px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  h1 { font-size:24px; margin:0 0 5px; }
  h2 { font-size:19px; margin:0 0 12px; }
  h3 { font-size:17px; margin:0 0 10px; }
  .muted { color:#555; font-size:14px; }
  label { display:block; font-weight:700; margin:10px 0 5px; }
  input, select, textarea, button {
    width:100%; font-size:16px; padding:12px; border:1px solid #bbb; border-radius:9px;
  }
  textarea { min-height:90px; resize:vertical; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .job, .material-row {
    border:1px solid #d6d9dd; border-radius:11px; padding:12px; margin-bottom:12px; background:#fafbfc;
  }
  .material-row { background:#fff; }
  .btn { border:none; font-weight:700; cursor:pointer; margin-top:8px; }
  .primary { background:#111; color:#fff; }
  .secondary { background:#e7eaee; }
  .danger { background:#ffe1e1; }
  .success { background:#dff5e3; }
  .summary-box { padding:12px; border:1px solid #ccc; border-radius:10px; background:#fafafa; }
  #report { white-space:pre-wrap; line-height:1.45; }
  .inline-check { display:flex; gap:8px; align-items:center; margin-top:10px; }
  .inline-check input { width:auto; }
  @media (max-width:620px){
    .grid2, .grid3 { grid-template-columns:1fr; }
  }
  @media print {
    body { background:#fff; }
    .no-print { display:none !important; }
    .card { box-shadow:none; border:1px solid #ccc; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1>Daily Electrical Time & Material Report</h1>
    <div class="muted">Employee phone form - Version 2</div>
  </div>

  <div class="card">
    <h2>Employee / Day</h2>
    <label>Employee Name</label>
    <input id="employee" placeholder="Your name" oninput="saveEmployeeName()">
    <label>Date</label>
    <input id="date" type="date">
  </div>

  <div class="card">
    <h2>Jobs Worked Today</h2>
    <div id="jobs"></div>
    <button class="btn secondary no-print" onclick="addJob()">+ Add Another Job</button>
  </div>

  <div class="card">
    <h2>Daily Totals</h2>
    <div class="grid3">
      <div><label>Regular Hours</label><input id="dailyRegular" readonly></div>
      <div><label>Overtime Hours</label><input id="dailyOT" readonly></div>
      <div><label>Total Hours</label><input id="dailyTotal" readonly></div>
    </div>
    <button class="btn secondary no-print" onclick="calculateDailyTotals()">Recalculate Totals</button>
  </div>

  <div class="card">
    <h2>Additional Notes</h2>
    <textarea id="notes" placeholder="Anything your boss should know..."></textarea>
  </div>

  <div class="card no-print">
    <button class="btn primary" onclick="generateReport()">Generate Boss Report</button>
    <button class="btn secondary" onclick="window.print()">Print / Save as PDF</button>
    <button class="btn success" onclick="shareReport()">Share Report</button>
    <button class="btn danger" onclick="newDay()">Start New Day</button>
  </div>

  <div class="card" id="reportCard" style="display:none;">
    <h2>Boss Report Preview</h2>
    <div id="report"></div>
  </div>

</div>

let jobCount = 0;

function setToday(){
  const d = new Date();
  const local = new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  document.getElementById("date").value = local;
}

function saveEmployeeName(){
  localStorage.setItem("electricalEmployeeName", document.getElementById("employee").value);
}

function loadEmployeeName(){
  document.getElementById("employee").value = localStorage.getItem("electricalEmployeeName") || "";
}

function addJob(){
  jobCount++;

  const div = document.createElement("div");
  div.className = "job";
  div.id = `job-${id}`;
  div.innerHTML = `
    <h3>Job ${id}</h3>

    <label>Job Name</label><input id="jobName-${id}">
    <label>Job #</label><input id="jobNumber-${id}">
    <label>Location</label><input id="jobLocation-${id}">

    <div class="grid3">
      <div><label>Start</label><input id="start-${id}" type="time"></div>
      <div><label>End</label><input id="end-${id}" type="time"></div>
      <div><label>Lunch (min)</label><input id="lunch-${id}" type="number" min="0" value="30"></div>
    </div>

    <button class="btn secondary no-print" id="calc-${id}" type="button">Calculate Hours</button>
    <div id="calcStatus-${id}" class="muted" style="margin-top:6px;"></div>

    <div class="grid3">
      <div><label>Regular Hrs</label><input id="reg-${id}" type="number" step="0.01" min="0"></div>
      <div><label>OT Hrs</label><input id="ot-${id}" type="number" step="0.01" min="0" value="0"></div>
      <div><label>Total Hrs</label><input id="total-${id}" readonly></div>
    </div>

    <label>Work Performed</label>
    <textarea id="work-${id}" placeholder="Describe the work completed..."></textarea>

    <label>Job Status</label>
    <select id="status-${id}">
      <option>Complete</option>
      <option>Return Needed</option>
      <option>In Progress</option>
    </select>

    <label>Materials Used</label>
    <div id="materials-${id}"></div>
    <button class="btn secondary no-print" onclick="addMaterial(${id}, false)">+ Add Material</button>

    <label>Materials Needed for Return Trip</label>
    <div id="returnMaterials-${id}"></div>
    <button class="btn secondary no-print" onclick="addMaterial(${id}, true)">+ Add Return Material</button>

    <label>Job Notes</label>
    <textarea id="jobNotes-${id}" placeholder="Access issues, inspection notes, return details, etc."></textarea>

    <button class="btn danger no-print" onclick="removeJob(${id})">Remove Job</button>
  `;
  document.getElementById("jobs").appendChild(div);
  addMaterial(id, false);

  const startEl = document.getElementById(`start-${id}`);
  const endEl = document.getElementById(`end-${id}`);
  const lunchEl = document.getElementById(`lunch-${id}`);
  const regEl = document.getElementById(`reg-${id}`);
  const otEl = document.getElementById(`ot-${id}`);
  const calcBtn = document.getElementById(`calc-${id}`);

  ["input","change","blur"].forEach(evt => {
    startEl.addEventListener(evt, () => calcJobHours(id));
    endEl.addEventListener(evt, () => calcJobHours(id));
    lunchEl.addEventListener(evt, () => calcJobHours(id));
  });

  regEl.addEventListener("input", calculateDailyTotals);
  otEl.addEventListener("input", calculateDailyTotals);
  calcBtn.addEventListener("click", () => calcJobHours(id, true));
}

function removeJob(id){
  const el = document.getElementById(`job-${id}`);
  if(el) el.remove();
  calculateDailyTotals();
}

function addMaterial(jobId, isReturn){
  const containerId = isReturn ? `returnMaterials-${jobId}` : `materials-${jobId}`;
  const container = document.getElementById(containerId);
  const key = `${jobId}-${isReturn ? "r" : "u"}-${Date.now()}-${Math.floor(Math.random()*9999)}`;

  const row = document.createElement("div");
  row.className = "material-row";
  row.dataset.key = key;
  row.innerHTML = `
    <label>Category</label>
    <select class="cat" onchange="updateMaterialRow(this)"></select>

    <label>Material</label>
    <select class="item" onchange="updateSizeForItem(this)"></select>

    <label>Size</label>
    <select class="size"></select>

    <label>Manufacturer / Brand</label>
    <select class="manufacturer"></select>

    <div class="wire-extra" style="display:none;">
      <label>Wire Color</label>
      <select class="wireColor"></select>
    </div>

    <div class="grid2">
      <div><label>Quantity</label><input class="qty" type="number" min="0" step="0.01"></div>
      <div><label>Unit</label>
        <select class="unit">
          <option>Each</option><option>Feet</option><option>Pieces</option>
          <option>Rolls</option><option>Boxes</option><option>Bundles</option>
        </select>
      </div>
    </div>

    <label>Custom Description (optional)</label>
    <input class="custom" placeholder="Special item, brand, catalog number, etc.">

    <button class="btn danger no-print" onclick="this.parentElement.remove()">Remove Material</button>
  `;
  container.appendChild(row);

  const cat = row.querySelector(".cat");
  Object.keys(materialData).forEach(k => {
    const o = document.createElement("option");
    o.value = k; o.textContent = k; cat.appendChild(o);
  });

  const wc = row.querySelector(".wireColor");
  wireColors.forEach(c => {
    const o = document.createElement("option");
    o.value = c; o.textContent = c; wc.appendChild(o);
  });

  updateMaterialRow(cat);
}

function updateSizeForItem(itemSelect){
  const row = itemSelect.closest(".material-row");
  const cat = row.querySelector(".cat").value;
  const item = itemSelect.value;
  const size = row.querySelector(".size");

  size.innerHTML = "";

  let sizes = materialData[cat].sizes;

  if(cat === "Boxes" && item === "Weatherproof Box"){
    sizes = ["Single Gang","Double Gang"];
  }

  if(cat === "Covers" && item === "Weatherproof Cover"){
    sizes = ["Single Gang","Double Gang"];
  }

  sizes.forEach(v => {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = v;
    size.appendChild(o);
  });
}

function updateMaterialRow(selectEl){
  const row = selectEl.closest(".material-row");
  const cat = selectEl.value;
  const item = row.querySelector(".item");
  const size = row.querySelector(".size");
  const wireExtra = row.querySelector(".wire-extra");

  item.innerHTML = "";
  size.innerHTML = "";
  const manufacturer = row.querySelector(".manufacturer");
  manufacturer.innerHTML = "";

  materialData[cat].items.forEach(v => {
    const o = document.createElement("option"); o.value=v; o.textContent=v; item.appendChild(o);
  });
  materialData[cat].sizes.forEach(v => {
    const o = document.createElement("option"); o.value=v; o.textContent=v; size.appendChild(o);
  });

  (manufacturerData[cat] || ["Other"]).forEach(v => {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = v;
    manufacturer.appendChild(o);
  });

  wireExtra.style.display = (cat === "Wire") ? "block" : "none";

  // Apply material-specific size choices such as Weatherproof Box.
  updateSizeForItem(item);
}

function calcJobHours(id, showMessage=false){
  const start = document.getElementById(`start-${id}`).value;
  const end = document.getElementById(`end-${id}`).value;
  const lunchRaw = document.getElementById(`lunch-${id}`).value;
  const status = document.getElementById(`calcStatus-${id}`);

  if(!start || !end){
    if(showMessage && status) status.textContent = "Enter both Start and End time.";
    return;
  }

  const startParts = start.split(":");
  const endParts = end.split(":");

  if(startParts.length < 2 || endParts.length < 2){
    if(status) status.textContent = "Invalid time format.";
    return;
  }

  const startMinutes = (Number(startParts[0]) * 60) + Number(startParts[1]);
  let endMinutes = (Number(endParts[0]) * 60) + Number(endParts[1]);
  const lunchMinutes = Number(lunchRaw || 0);

  if(endMinutes < startMinutes){
    endMinutes += 1440;
  }

  let workedMinutes = endMinutes - startMinutes - lunchMinutes;
  if(workedMinutes < 0) workedMinutes = 0;

  const workedHours = workedMinutes / 60;
  const regularHours = Math.min(workedHours, 8);
  const overtimeHours = Math.max(workedHours - 8, 0);

  document.getElementById(`reg-${id}`).value = regularHours.toFixed(2);
  document.getElementById(`ot-${id}`).value = overtimeHours.toFixed(2);
  document.getElementById(`total-${id}`).value = workedHours.toFixed(2);

  if(status){
    status.textContent = `Calculated: ${workedHours.toFixed(2)} total hours`;
  }

  calculateDailyTotals();
}

function calculateDailyTotals(){
  let reg=0, ot=0;
  document.querySelectorAll(".job").forEach(job => {
    const id = job.id.split("-")[1];
    const r = parseFloat(document.getElementById(`reg-${id}`).value || 0);
    const o = parseFloat(document.getElementById(`ot-${id}`).value || 0);
    reg += r; ot += o;
    document.getElementById(`total-${id}`).value = (r+o).toFixed(2);
  });
  document.getElementById("dailyRegular").value = reg.toFixed(2);
  document.getElementById("dailyOT").value = ot.toFixed(2);
  document.getElementById("dailyTotal").value = (reg+ot).toFixed(2);
}

function readMaterialRows(containerId){
  const rows = [];
  document.querySelectorAll(`#${containerId} .material-row`).forEach(row => {
    const qty = row.querySelector(".qty").value;
    if(!qty) return;
    const cat = row.querySelector(".cat").value;
    const item = row.querySelector(".item").value;
    const size = row.querySelector(".size").value;
    const unit = row.querySelector(".unit").value;
    const custom = row.querySelector(".custom").value;
    const color = row.querySelector(".wireColor")?.value || "";
    const manufacturer = row.querySelector(".manufacturer")?.value || "";
    rows.push({
      qty, cat, item, size, unit, custom, manufacturer,
      color: cat === "Wire" ? color : ""
    });
  });
  return rows;
}

function val(id){ return document.getElementById(id)?.value || ""; }

function makeReport(){
  calculateDailyTotals();
  const lines = [];
  lines.push("DAILY ELECTRICAL TIME & MATERIAL REPORT");
  lines.push("");
  lines.push("Employee: " + val("employee"));
  lines.push("Date: " + val("date"));
  lines.push("");
  lines.push("DAILY HOURS");
  lines.push(`Regular: ${val("dailyRegular")}   OT: ${val("dailyOT")}   Total: ${val("dailyTotal")}`);
  lines.push("");

  let count = 0;
  document.querySelectorAll(".job").forEach(job => {
    count++;
    const id = job.id.split("-")[1];
    lines.push(`JOB ${count}`);
    lines.push("Job Name: " + val(`jobName-${id}`));
    lines.push("Job #: " + val(`jobNumber-${id}`));
    lines.push("Location: " + val(`jobLocation-${id}`));
    lines.push(`Time: ${val(`start-${id}`)} - ${val(`end-${id}`)} | Lunch: ${val(`lunch-${id}`)} min`);
    lines.push(`Regular: ${val(`reg-${id}`)} | OT: ${val(`ot-${id}`)} | Total: ${val(`total-${id}`)}`);
    lines.push("Status: " + val(`status-${id}`));
    lines.push("");
    lines.push("Work Performed:");
    lines.push(val(`work-${id}`) || "None entered");
    lines.push("");
    lines.push("Materials Used:");
    const used = readMaterialRows(`materials-${id}`);
    if(!used.length) lines.push("- None entered");
    used.forEach(m => {
      lines.push(`- ${m.qty} ${m.unit} | ${m.cat} | ${m.item} | ${m.size}${m.manufacturer ? " | " + m.manufacturer : ""}${m.color ? " | " + m.color : ""}${m.custom ? " | " + m.custom : ""}`);
    });
    lines.push("");
    lines.push("Return-Trip Materials Needed:");
    const ret = readMaterialRows(`returnMaterials-${id}`);
    if(!ret.length) lines.push("- None entered");
    ret.forEach(m => {
      lines.push(`- ${m.qty} ${m.unit} | ${m.cat} | ${m.item} | ${m.size}${m.manufacturer ? " | " + m.manufacturer : ""}${m.color ? " | " + m.color : ""}${m.custom ? " | " + m.custom : ""}`);
    });
    lines.push("");
    lines.push("Job Notes:");
    lines.push(val(`jobNotes-${id}`) || "None");
    lines.push("");
    lines.push("----------------------------------------");
    lines.push("");
  });

  lines.push("ADDITIONAL NOTES");
  lines.push(val("notes") || "None");
  return lines.join("\n");
}

function generateReport(){
  const report = makeReport();
  document.getElementById("report").textContent = report;
  document.getElementById("reportCard").style.display = "block";
  document.getElementById("reportCard").scrollIntoView({behavior:"smooth"});
}

async function shareReport(){
  const report = makeReport();
  const title = `Electrical T&M - ${val("date")} - ${val("employee")}`;
  if(navigator.share){
    try {
      await navigator.share({title, text:report});
    } catch(e) {}
  } else {
    try {
      await navigator.clipboard.writeText(report);
      alert("Report copied to clipboard. Paste it into a text or email to your boss.");
    } catch(e) {
      alert("Use Generate Boss Report, then copy the report manually.");
    }
  }
}

function newDay(){
  const employee = document.getElementById("employee").value || localStorage.getItem("electricalEmployeeName") || "";

  // Clear all current jobs and reset counters.
  const jobsContainer = document.getElementById("jobs");
  jobsContainer.innerHTML = "";
  jobCount = 0;

  // Clear daily notes and report preview.
  document.getElementById("notes").value = "";
  document.getElementById("report").textContent = "";
  document.getElementById("reportCard").style.display = "none";

  // Reset daily totals.
  document.getElementById("dailyRegular").value = "0.00";
  document.getElementById("dailyOT").value = "0.00";
  document.getElementById("dailyTotal").value = "0.00";

  // Set today's date again.
  setToday();

  // Keep employee name.
  document.getElementById("employee").value = employee;
  localStorage.setItem("electricalEmployeeName", employee);

  // Create one fresh blank job.
  addJob();
  calculateDailyTotals();

  // Move back to top so the new sheet is obvious on a phone.
  window.scrollTo({ top: 0, behavior: "smooth" });
}

loadEmployeeName();
setToday();
addJob();
calculateDailyTotals();
